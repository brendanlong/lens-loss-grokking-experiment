# Stability grid: capability vs embedding vs neuron stability, per architecture.
# results_dir has no default: pass --config results_dir=/abs/path. It must be
# absolute because each gpuc job runs in its own copy of the repo, where a
# relative path would land out of the controller's sight.

seeds: [42, 43, 44]
total_steps: 50000
checkpoint_every: 1000
wandb: true

# Post-grok window for the lag curves; every published 2-layer run first-grokked
# well before 30k, but slow 1-layer seeds may not (check first_grok in the
# summaries).
window_start: 30000
lags: [100, 200, 500, 1000, 2000, 5000, 10000, 15000, 19900]

cells:
  L1-ln:
    label: 1 layer, LayerNorm
    args: --n-layers 1
  L2-ln:
    label: 2 layers, LayerNorm
    args: --n-layers 2
  L2-ln-aux:
    label: 2 layers, LayerNorm, aux loss
    args: --n-layers 2 --aux-lambda 0.3
  L1-noln:
    label: 1 layer, no LayerNorm (Nanda)
    args: --n-layers 1 --no-layernorm
  L2-noln:
    label: 2 layers, no LayerNorm
    args: --n-layers 2 --no-layernorm
  L2-noln-aux:
    label: 2 layers, no LayerNorm, aux loss
    args: --n-layers 2 --no-layernorm --aux-lambda 0.3
  L2-ln-dropout:
    label: 2 layers, LayerNorm, dropout 0.1
    args: --n-layers 2 --dropout 0.1
  L2-ln-lrdrop:
    label: 2 layers, LayerNorm, LR ×0.1 at 20k
    args: --n-layers 2 --lr-schedule step --lr-step-at 20000 --lr-step-factor 0.1
  L2-ln-anneal:
    label: 2 layers, LayerNorm, LR annealed 20k→40k
    args: --n-layers 2 --lr-schedule wsd --lr-decay-start 20000 --lr-decay-end 40000 --lr-decay-floor 0.1
    # lag curves only over the flat tail, not the moving LR
    window_start: 40000

# Panel layout for the grid figures (rows of cell names).
figure_rows:
  - [L1-ln, L2-ln, L2-ln-aux]
  - [L1-noln, L2-noln, L2-noln-aux]
  - [L2-ln-dropout, L2-ln-lrdrop, L2-ln-anneal]
