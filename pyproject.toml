[project]
name = "lens-loss-grokking-experiment"
version = "1.0.0"
description = "Deep supervision vs grokking: chronic instability, weight-decay circuit pruning, and failure isolation"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "pydantic>=2.0",
    "wandb>=0.19",
    "matplotlib>=3.9",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "ruff>=0.9",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "ANN",   # flake8-annotations
    "RUF",   # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["ANN"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
]

[tool.ruff.lint.isort]
known-first-party = ["common", "grok_lens", "lego"]
known-third-party = ["wandb"]  # local wandb/ run dir must not flip classification vs CI
